<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">GymApp</span>
      <span class="brand-badge">Admin Portal</span>
    </div>

    <h1 class="title">Sign in</h1>
    <p class="subtitle">Admin and super admin access only.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Email address</label>
        <input type="email" formControlName="email" placeholder="admin@gymapp.com" autocomplete="email" />
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">Email is required.</span>
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">Enter a valid email.</span>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Your password" autocomplete="current-password" />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword">{{ showPassword ? '🙈' : '👁️' }}</button>
        </div>
        <span class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['required']">Password is required.</span>
      </div>

      <div class="alert-error" *ngIf="error">⚠️ {{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Sign in</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>
  </div>
</div>
