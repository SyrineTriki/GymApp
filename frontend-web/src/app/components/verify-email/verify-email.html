<div class="verify-shell">
  <div class="verify-card">

    <!-- Loading -->
    <ng-container *ngIf="status === 'loading'">
      <div class="spinner-large" aria-label="Verifying…"></div>
      <h1 class="card-title">Verifying your email…</h1>
      <p class="card-sub">Just a moment.</p>
    </ng-container>

    <!-- Success -->
    <ng-container *ngIf="status === 'success'">
      <div class="status-icon success-icon">✅</div>
      <h1 class="card-title">Email verified!</h1>
      <p class="card-sub">{{ message }}</p>
      <button class="btn btn--primary btn--full" (click)="goToLogin()" type="button">
        Go to login
      </button>
    </ng-container>

    <!-- Error -->
    <ng-container *ngIf="status === 'error'">
      <div class="status-icon error-icon">❌</div>
      <h1 class="card-title">Verification failed</h1>
      <p class="card-sub">{{ message }}</p>
      <a routerLink="/register" class="btn btn--primary btn--full" style="text-align:center;display:block;">
        Back to register
      </a>
    </ng-container>

  </div>
</div>
